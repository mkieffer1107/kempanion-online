[package]
name = "kempa_synth"
version = "0.1.0"
edition = "2021"
description = "Kempanion Online chiptune synthesizer (WebAssembly, AudioWorklet, plain C ABI)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# Tests render many seconds of audio; keep them reasonably fast.
[profile.dev]
opt-level = 2

[profile.test]
opt-level = 2
