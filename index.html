<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#1a1030" />
    <meta name="color-scheme" content="dark" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Kempanion Online — a visual novel x virtual pet set at the University of Florida. A Kempa AI production. Fan-made, not affiliated with or endorsed by the University of Florida." />
    <!-- Link previews: iMessage plays the video as a muted loop, other apps show the card. Absolute URLs on purpose
         (Vite would rewrite root-relative media URLs here to "./og/...", which crawlers can't use). The media comes
         from `bun run og`; bump -v1 in the file names on every change, since previews are cached by URL. -->
    <link rel="canonical" href="https://kempanion.online/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kempanion.online/" />
    <meta property="og:site_name" content="Kempanion Online" />
    <meta property="og:title" content="Kempanion Online" />
    <meta property="og:description" content="A visual novel x virtual pet with Piggy 1, 2 &amp; 3 on a sakura-filled campus." />
    <meta property="og:image" content="https://kempanion.online/og/kempanion-sakura-v1.png" />
    <meta property="og:image:secure_url" content="https://kempanion.online/og/kempanion-sakura-v1.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1920" />
    <meta property="og:image:height" content="1008" />
    <meta property="og:image:alt" content="Pixel-art Century Tower at sunset under pink cherry blossoms, with Piggy 1, 2 and 3 on the path below the Kempanion Online logo." />
    <meta property="og:video" content="https://kempanion.online/og/kempanion-sakura-v1.mp4" />
    <meta property="og:video:secure_url" content="https://kempanion.online/og/kempanion-sakura-v1.mp4" />
    <meta property="og:video:type" content="video/mp4" />
    <meta property="og:video:width" content="960" />
    <meta property="og:video:height" content="504" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kempanion Online" />
    <meta name="twitter:description" content="A visual novel x virtual pet with Piggy 1, 2 &amp; 3 on a sakura-filled campus." />
    <meta name="twitter:image" content="https://kempanion.online/og/kempanion-sakura-v1.png" />
    <meta name="twitter:image:alt" content="Pixel-art Century Tower at sunset under pink cherry blossoms, with Piggy 1, 2 and 3 on the path below the Kempanion Online logo." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kempanion" />
    <title>Kempanion Online</title>
    <style>
      /* First paint (< 2 KB): a pixel title + 3-dot loader until the app mounts. */
      html, body { margin: 0; height: 100%; background: #1a1030; overscroll-behavior: none; }
      #boot {
        position: fixed; inset: 0; display: grid; place-content: center; gap: 18px; justify-items: center;
        color: #ffe3ea; font: 700 22px/1.2 monospace; letter-spacing: 0.18em; text-align: center;
        background: radial-gradient(ellipse at 50% 40%, #2a1d4a, #1a1030 70%);
      }
      #boot small { display: block; font-size: 11px; letter-spacing: 0.3em; color: #f48fb1; margin-top: 6px; }
      #boot i { display: inline-block; width: 8px; height: 8px; margin: 0 5px; background: #ffb7c5; animation: bt 0.9s steps(1) infinite; }
      #boot i:nth-child(2) { animation-delay: 0.3s; }
      #boot i:nth-child(3) { animation-delay: 0.6s; }
      @keyframes bt { 50% { opacity: 0.15; } }
      @media (prefers-reduced-motion: reduce) { #boot i { animation: none; } }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="boot" role="status" aria-label="Loading Kempanion Online">
        <div>KEMPANION<small>ONLINE</small></div>
        <div aria-hidden="true"><i></i><i></i><i></i></div>
      </div>
    </div>
    <noscript>Kempanion Online needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
